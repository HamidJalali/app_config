apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  labels:
    app: myapp-deploy-label
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: hjcontainer/myapp:latest
        ports:
        - containerPort: 8080
      imagePullSecrets:
      - name: docker-registry-secret
